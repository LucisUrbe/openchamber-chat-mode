<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>聊天模式</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: clamp(16px, 3vw, 32px);
      color: var(--oc-fg, #20242b);
      background: var(--oc-bg, #f7f8fa);
      font-family: var(--oc-font, system-ui, sans-serif);
      font-size: 13px;
      line-height: 1.6;
    }
    .panel { max-width: 1200px; margin: 0 auto; }
    h2, p { margin: 0; }
    h2 { font-size: 15px; line-height: 1.4; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
    .overview { display: grid; gap: 16px; min-width: 0; }
    .card {
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--oc-border, #e1e4e9);
      border-radius: 12px;
      background: var(--oc-elevated, #fff);
    }
    .section-description { margin-top: 4px; color: var(--oc-muted, #646b76); }
    .project-field { margin-top: 20px; }
    label { display: block; font-weight: 600; }
    .select-wrap { position: relative; margin-top: 7px; }
    .select-wrap::after {
      position: absolute;
      top: 50%;
      right: 14px;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      color: var(--oc-muted, #646b76);
      content: "";
      pointer-events: none;
      transform: translateY(-70%) rotate(45deg);
    }
    select {
      display: block;
      width: 100%;
      min-width: 0;
      height: 38px;
      padding: 0 34px 0 11px;
      overflow: hidden;
      border: 1px solid var(--oc-border, #d6dbe3);
      border-radius: 8px;
      appearance: none;
      color: inherit;
      background: var(--oc-bg, #f7f8fa);
      font: inherit;
      text-overflow: ellipsis;
    }
    select option { color: var(--oc-fg, #20242b); background: var(--oc-elevated, #fff); }
    .status-box {
      display: grid;
      gap: 3px;
      margin-top: 16px;
      padding: 11px 12px;
      border-radius: 8px;
      background: var(--oc-muted-surface, #f1f3f6);
    }
    .status-label { color: var(--oc-muted, #646b76); font-size: 12px; }
    #status { font-weight: 600; overflow-wrap: anywhere; }
    .note { margin-top: 12px; color: var(--oc-muted, #646b76); font-size: 12px; line-height: 1.7; }
    .actions { margin-top: 16px; }
    .guide-copy { margin-top: 12px; line-height: 1.75; }
    .history-card { min-height: 248px; }
    .history-heading { padding-bottom: 16px; border-bottom: 1px solid var(--oc-border, #e1e4e9); }
    #history { margin: 8px -8px -4px; }
    #history .oc-sdk-row { min-height: 46px; padding: 10px 8px; }
    #history .oc-sdk-list-empty {
      display: grid;
      min-height: 140px;
      padding: 20px 12px;
      place-items: center;
      line-height: 1.6;
    }
    #error {
      margin: 0 0 16px;
      padding: 10px 12px;
      border: 1px solid var(--oc-error, #c75d45);
      border-radius: 8px;
      color: var(--oc-error-text, #a43e2b);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    #error:empty { display: none; }
    select:focus-visible, #refresh .oc-sdk-btn:focus-visible, #history .oc-sdk-list:focus-visible {
      outline: 2px solid var(--oc-focus, #537bc5);
      outline-offset: 2px;
    }
    @media (min-width: 680px) {
      .layout { grid-template-columns: minmax(240px, min(320px, 38%)) minmax(0, 1fr); }
      .history-card { min-height: 100%; }
    }
    @media (max-width: 360px) {
      .card { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="panel">
    <p id="error" role="alert"></p>
    <main class="layout">
      <div class="overview">
        <section class="card" aria-labelledby="project-heading">
          <h2 id="project-heading">聊天项目</h2>
          <p class="section-description">绑定独立项目，查看当前状态</p>
          <div class="project-field">
            <label for="project">独立聊天项目</label>
            <div class="select-wrap">
              <select id="project"><option value="">请选择已部署的聊天项目</option></select>
            </div>
          </div>
          <div class="status-box">
            <span class="status-label">当前状态</span>
            <p id="status" role="status">正在连接 OpenChamber…</p>
          </div>
          <p class="note">此面板只显示项目与 Agent 状态。权限由聊天项目的服务端配置决定。</p>
          <div class="actions"><span id="refresh"></span></div>
        </section>

        <section class="card" aria-labelledby="guide-heading">
          <h2 id="guide-heading">新建聊天</h2>
          <p class="guide-copy">切换至此项目，使用 OpenChamber 原生“新建会话”，确认 Agent 为 <b>Chat</b> 后发送消息。</p>
          <p class="note">可选择模型、上传图片或文字附件，并使用联网、记忆和交互展示。记忆需在通用设置中启用；图片理解需要视觉模型，搜索需要可用的搜索供应商。</p>
        </section>
      </div>

      <section class="card history-card" aria-labelledby="history-heading">
        <div class="history-heading">
          <h2 id="history-heading">聊天历史</h2>
          <p class="section-description">选择会话，继续之前的聊天</p>
        </div>
        <div id="history"></div>
      </section>
    </main>
  </div>
  <script src="main.js"></script>
</body>
</html>
